  outputs: [text]
  license: MIT
  openness: open-source
  commercial_use: yes
  license_note: null
  params: 1.55B
  vram_min_gb: null
  runs_on: [gpu, cpu]
  specialization: >
    범용 전사에서 여전히 가장 무난한 올라운더. 언어 커버리지가 넓어
    입력 언어를 특정할 수 없을 때 기본값으로 쓴다.
  strengths: [multilingual, general-purpose, permissive-license]
  weaknesses: [slower-than-parakeet, not-realtime]
  links: {huggingface: https://huggingface.co/openai/whisper-large-v3, github: https://github.com/openai/whisper, paper: null}
