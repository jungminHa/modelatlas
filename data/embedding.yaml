# Embedding and reranking — the foundation of a RAG pipeline

- id: qwen3-embedding-8b
  name: Qwen3-Embedding-8B
  category: embedding
  task: text-embedding
  vendor: Alibaba
  repo_id: Qwen/Qwen3-Embedding-8B
  inputs: [text]
  outputs: [embedding]
  license: Apache-2.0
  openness: open-weight
  commercial_use: yes
  license_note: null
  params: 8B
  params_b: 8
  vram_min_gb: null
  runs_on: [gpu]
  specialization: >
    Covers 100+ natural and programming languages and leads the MTEB snapshot. Accepts
    user-defined instructions so behaviour can be tuned per domain. 0.6B and 4B variants
    let you trade quality for resources.
  strengths: [mteb-leading, multilingual, instruction-tunable]
  weaknesses: [gpu-required]
  links: {huggingface: https://huggingface.co/Qwen, github: https://github.com/QwenLM, paper: https://arxiv.org/abs/2506.05176}
  released: 2025-06
  benchmarks:
    - name: MTEB
      value: leading
      note: as of the 2026-09 snapshot
  sources: [https://www.bentoml.com/blog/a-guide-to-open-source-embedding-models]
  verified: 2026-09-23

