# 임베딩 · 리랭킹 — RAG 파이프라인의 기반

- id: qwen3-embedding-8b
  name: Qwen3-Embedding-8B
  category: embedding
  task: text-embedding
  vendor: Alibaba
  inputs: [text]
  outputs: [embedding]
  license: Apache-2.0
  openness: open-weight
  commercial_use: yes
  license_note: null
  params: 8B
  vram_min_gb: null
  runs_on: [gpu]
  specialization: >
    100개 이상의 자연어·프로그래밍 언어를 지원하고 MTEB 선두권.
    사용자 정의 지시문을 받아 도메인별로 동작을 조정할 수 있다.
    0.6B · 4B 변형이 있어 자원에 맞춰 고를 수 있다.
  strengths: [mteb-leading, multilingual, instruction-tunable]
  weaknesses: [gpu-required]
  links: {huggingface: https://huggingface.co/Qwen, github: https://github.com/QwenLM, paper: https://arxiv.org/abs/2506.05176}
  released: 2025-06
  benchmarks:
    - name: MTEB
      value: 선두
      note: 2026-09 스냅샷 기준
  sources: [https://www.bentoml.com/blog/a-guide-to-open-source-embedding-models]
  verified: 2026-09-23

