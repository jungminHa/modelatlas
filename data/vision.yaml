# 컴퓨터 비전 — 검출 · 분할 · OCR

- id: rf-detr
  name: RF-DETR
  category: vision
  task: object-detection
  vendor: Roboflow
  inputs: [image]
  outputs: [boxes, mask]
  license: Apache-2.0
  openness: open-source
  commercial_use: yes
  license_note: null
  params: null
  vram_min_gb: null
  runs_on: [gpu]
  specialization: >
    COCO 와 실환경 벤치마크(RF100-VL) 양쪽에서 1위. 대부분의 비전 프로젝트에서
    정확도 기준 첫 선택지로 권장된다.
  strengths: [accuracy, real-world-robust, detection-and-segmentation]
  weaknesses: [slower-than-yolo]
  links:
    huggingface: null
    github: https://github.com/roboflow/rf-detr
    paper: null
  released: 2025
  benchmarks:
    - name: COCO
      value: SOTA (2026 기준)
    - name: RF100-VL
      value: SOTA (2026 기준)
  sources: [https://blog.roboflow.com/best-object-detection-models/]
  verified: 2026-09-23

- id: yolo26
  name: YOLO26
  category: vision
  task: object-detection
  vendor: Ultralytics
  inputs: [image, video]
  outputs: [boxes, mask]
  license: AGPL-3.0
  openness: open-source
  commercial_use: conditional
  license_note: AGPL-3.0. 상업적 폐쇄 배포에는 별도 상용 라이선스 필요
  params: Nano ~ Extra Large (5종)
  vram_min_gb: null
  runs_on: [gpu, cpu, edge]
  specialization: >
    엣지·실시간에 최적화. NMS 없는 end-to-end 예측으로 후처리가 단순하고,
    CPU 추론이 YOLO11-N 대비 최대 43% 빠르다. 검출·분할·분류·포즈·회전박스를 한 모델로 처리.
  strengths: [realtime, edge, cpu-fast, multi-task]
  weaknesses: [agpl-license]
  links:
    huggingface: null
    github: https://github.com/ultralytics/ultralytics
    paper: https://arxiv.org/abs/2606.03748
  released: 2026-01
  benchmarks:
    - name: COCO mAP (Nano)
      value: 40.9
      note: T4 에서 1.7ms
    - name: COCO mAP (Extra Large)
      value: 57.5
  sources: [https://blog.roboflow.com/best-object-detection-models/]
  verified: 2026-09-23

