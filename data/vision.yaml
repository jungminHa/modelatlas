# Computer vision — detection, segmentation, OCR

- id: rf-detr
  name: RF-DETR
  category: vision
  task: object-detection
  vendor: Roboflow
  inputs: [image]
  outputs: [boxes, mask]
  license: Apache-2.0
  openness: open-source
  commercial_use: yes
  license_note: null
  params: null
  params_b: null
  vram_min_gb: null
  runs_on: [gpu]
  specialization: >
    Tops both COCO and the real-world RF100-VL benchmark. The recommended accuracy-first
    starting point for most vision projects.
  strengths: [accuracy, real-world-robust, detection-and-segmentation]
  weaknesses: [slower-than-yolo]
  links:
    huggingface: null
    github: https://github.com/roboflow/rf-detr
    paper: null
  released: 2025
  benchmarks:
    - name: COCO
      value: SOTA as of 2026
    - name: RF100-VL
      value: SOTA as of 2026
  sources: [https://blog.roboflow.com/best-object-detection-models/]
  verified: 2026-09-23

- id: yolo26
  name: YOLO26
  category: vision
  task: object-detection
  vendor: Ultralytics
  inputs: [image, video]
  outputs: [boxes, mask]
  license: AGPL-3.0
  openness: open-source
  commercial_use: conditional
  license_note: AGPL-3.0 — a separate commercial license is required for closed-source distribution
  params: Nano to Extra Large (5 sizes)
  params_b: null
  vram_min_gb: null
  runs_on: [gpu, cpu, edge]
  specialization: >
    Optimized for edge and real-time use. NMS-free end-to-end prediction simplifies
    post-processing, and CPU inference is up to 43% faster than YOLO11-N. One model covers
    detection, segmentation, classification, pose and oriented boxes.
  strengths: [realtime, edge, cpu-fast, multi-task]
  weaknesses: [agpl-license]
  links:
    huggingface: null
    github: https://github.com/ultralytics/ultralytics
    paper: https://arxiv.org/abs/2606.03748
  released: 2026-01
  benchmarks:
    - name: COCO mAP (Nano)
      value: 40.9
      note: 1.7ms on a T4
    - name: COCO mAP (Extra Large)
      value: 57.5
  sources: [https://blog.roboflow.com/best-object-detection-models/]
  verified: 2026-09-23

