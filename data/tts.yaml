# Text to speech (text → speech)
# Licensing mistakes are most common in this category — always check commercial_use.

- id: kokoro
  name: Kokoro
  category: tts
  task: text-to-speech
  vendor: Independent
  inputs: [text]
  outputs: [speech]
  license: Apache-2.0
  openness: open-source
  redistributable: yes
  commercial_use: yes
  license_note: null
  params: 82M
  params_b: 0.082
  vram_min_gb: 0
  download_gb: 0.34
  runs_on: [cpu, gpu, edge]
  specialization: >
    Very light at 82M parameters, fast enough on CPU to be the easiest final stage in a
    local pipeline. It cannot clone a voice from a sample, however.
  strengths: [tiny, cpu-friendly, permissive-license]
  weaknesses: [no-voice-cloning]
  links: {huggingface: https://huggingface.co/hexgrad/Kokoro-82M, github: null, paper: null}
  released: 2025
  benchmarks: []
  sources: [https://www.centron.de/en/tutorials/best-open-source-tts-models-compared-kokoro-f5-tts-sparktts-sesa]
  verified: 2026-09-23

- id: f5-tts
  name: F5-TTS
  category: tts
  task: text-to-speech
  vendor: SWivid
  repo_id: SWivid/F5-TTS
  inputs: [text, speech]
  outputs: [speech]
  license: MIT
  openness: open-source
  redistributable: yes
  commercial_use: yes
  license_note: Code is MIT; check separately for constraints tied to training data provenance
  params: null
  params_b: null
  vram_min_gb: null
  download_gb: 6.28
  runs_on: [gpu]
  specialization: >
    Flow-matching based, with notably good voice cloning — give it a reference clip and it
    synthesizes in that voice. Start here when quality matters most.
  strengths: [voice-cloning, quality]
  weaknesses: [gpu-required]
  links: {huggingface: null, github: https://github.com/SWivid/F5-TTS, paper: https://arxiv.org/abs/2410.06885}
  released: 2024-10
  benchmarks: []
  sources: [https://www.centron.de/en/tutorials/best-open-source-tts-models-compared-kokoro-f5-tts-sparktts-sesa]
  verified: 2026-09-23

- id: xtts-v2
  name: XTTS-v2
  category: tts
  task: text-to-speech
  vendor: Coqui
  inputs: [text, speech]
  outputs: [speech]
  license: Coqui Public Model License
  openness: open-weight
  redistributable: no
  commercial_use: no
  license_note: >
    Non-commercial use only. It is the most-downloaded TTS model on Hugging Face, but
    shipping it in a commercial product means ripping it back out later.
  params: null
  params_b: null
  vram_min_gb: null
  download_gb: 1.95
  runs_on: [gpu]
  specialization: >
    Clones a voice into another language from a six-second sample. Capable, but the
    license rules out commercial use.
  strengths: [cross-lingual-cloning, few-shot]
  weaknesses: [non-commercial-license]
  links: {huggingface: https://huggingface.co/coqui/XTTS-v2, github: null, paper: null}
  released: 2023
  benchmarks: []
  sources: [https://www.centron.de/en/tutorials/best-open-source-tts-models-compared-kokoro-f5-tts-sparktts-sesa]
  verified: 2026-09-23

