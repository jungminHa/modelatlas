# 영상 생성

- id: wan-2-2
  name: Wan 2.2
  category: video-gen
  task: text-to-video
  vendor: Alibaba
  inputs: [text, image]
  outputs: [video]
  license: Apache-2.0
  openness: open-source
  commercial_use: yes
  license_note: null
  params: 5B (GGUF 변형)
  vram_min_gb: 8
  runs_on: [gpu]
  specialization: >
    Apache-2.0 로 상업 사용이 자유롭고, 5B GGUF 에 메모리 오프로딩을 쓰면
    VRAM 8GB 에서도 돈다. 로컬 실행 전제라면 가장 현실적인 선택.
    동작 사실감과 프롬프트 준수도는 Sora·Veo 급에 근접한다.
  strengths: [permissive-license, low-vram, quality]
  weaknesses: []
  links: {huggingface: https://huggingface.co/Wan-AI, github: https://github.com/Wan-Video, paper: null}
  released: 2025
  benchmarks: []
  sources: [https://www.hyperstack.cloud/blog/case-study/best-open-source-video-generation-models]
  verified: 2026-09-23

- id: ltx-2-3
  name: LTX-2.3
  category: video-gen
  task: text-to-video
  vendor: Lightricks
  inputs: [text, image]
  outputs: [video, audio]
  license: null
  openness: open-weight
  commercial_use: conditional
  license_note: 라이선스 확인 필요
  params: null
  vram_min_gb: null
  runs_on: [gpu]
  specialization: >
    오픈 모델 중 유일하게 네이티브 오디오를 지원한다. 영상과 동기화된 소리를
    한 번의 디퓨전 패스에서 함께 생성하며 4K·50fps 출력이 가능하다.
    후처리로 소리를 붙일 필요가 없어 조합 파이프라인이 짧아진다.
  strengths: [native-audio, 4k, high-fps]
  weaknesses: [license-unclear, vram-heavy]
